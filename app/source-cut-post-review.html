<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Threads 게시글 평가</title><link rel="stylesheet" href="./source-cut-post-review.css"></head>
<body><aside class="library"><header><span class="eyebrow">THREADS · REVIEW</span><h1>게시글 평가</h1><p id="roundLabel" role="status">현재 제작본</p><p id="count">제작 결과를 불러오는 중</p></header><button id="closeLibrary" type="button">목록 접기</button>
<input id="search" type="search" placeholder="제목 검색" aria-label="제목 검색">
<select id="filter" aria-label="평가 상태"><option value="all">제작 순서대로 · 전체 글</option><option value="priority">먼저 검토할 글</option><option value="improve">제목·이미지 보완</option><option value="long">장문 흐름 검토</option><option value="sensitive">표현·사실 검토</option><option value="unrated">아직 점수 없는 글</option><option value="rated">점수 남긴 글</option><option value="low">1~5점 · 개선할 글</option></select>
<select id="topic" aria-label="주제"><option value="">모든 주제</option></select><select id="workflow" aria-label="제작 적격 상태"><option value="eligible">검토할 제작물</option><option value="held">보류 · 원본·제작 보완</option><option value="rejected">탈락 · 소재 부적합</option><option value="all">원본 포함 전체</option></select><label class="seen-filter"><input id="excludeSeen" type="checkbox"> 본 글 제외</label><button id="randomPost" type="button">안 본 적격 글 랜덤</button><div class="review-cycle-actions"><button id="reload" type="button">새로 보기</button><button id="openHistory" type="button">과거 기록</button></div><div id="posts" class="posts" aria-label="글 선택"></div><button id="openFolder" type="button">평가 기록 폴더 열기</button></aside>
<main><div class="view-actions"><button id="toggleLibrary" type="button" aria-controls="posts" aria-expanded="true">글 목록 접기</button><button id="showFullTitle" type="button" disabled>원문 제목 전체</button></div><header class="post-head"><p class="eyebrow" id="postMeta">글을 선택하세요</p><h2 id="title">표지부터 마지막 장까지 직접 확인하세요</h2><p id="original"></p></header>
<p id="error" role="alert" hidden></p>
<section id="unavailable" class="reader-notice" role="status" hidden></section>
<section id="loadRecovery" class="reader-notice" role="status" hidden><p id="recoveryMessage"></p><div class="recovery-actions"><button id="reloadLatest" type="button">최신 목록으로 다시 불러오기</button><button id="retryPage" type="button">이 장 다시 불러오기</button></div></section>
<p id="roundNotice" class="reader-notice" role="status" hidden></p>
<details id="previousDraft" class="reader-notice" open hidden><summary>이전 제작물의 미저장 평가 · 이 창에서만 보관</summary><pre id="previousDraftText"></pre><p>새 제작물에 자동 저장하지 않았습니다. 창을 닫기 전에 필요한 메모를 복사해 두세요.</p></details>
<section id="reader" hidden><div class="reader-tools"><div class="segments"><button id="single" type="button" aria-pressed="true">한 장씩 넘기기</button><button id="vertical" type="button" aria-pressed="false">아래로 읽기</button></div><button id="fromCover" type="button">표지부터 끝까지</button><label><input id="zoom" type="checkbox">크게 보기</label></div><p id="loadState" role="status" hidden></p>
<div id="stage" class="stage"><button id="prev" class="arrow" aria-label="이전 장" type="button">‹</button><figure><img id="pageImage" alt=""><figcaption id="pageLabel"></figcaption></figure><button id="next" class="arrow" aria-label="다음 장" type="button">›</button></div>
<div id="pages" class="page-nav"><label>페이지 <select id="pageSelect" aria-label="페이지 선택"></select></label><span>← → 장 넘기기 · ↑ ↓ 다른 글 · 좌우 스와이프</span></div>
<div id="verticalPages" hidden></div>
<section class="feedback" aria-label="이 글 전체 평가"><div class="feedback-heading"><h3>이 글 전체는 몇 점인가요?</h3><strong id="scoreText">아직 평가하지 않았어요</strong></div>
<div id="scores" class="scores" role="group" aria-label="1점부터 10점까지 선택"></div>
<label for="note">평가 메모</label><textarea id="note" maxlength="10000" rows="4" placeholder="제목, 글씨, 디자인, 내용, 장 사이 흐름… 좋았던 점과 고칠 점을 적어주세요."></textarea>
<div class="save-row"><span id="saveStatus" role="status" aria-live="polite"></span><button id="save" type="button">평가 저장</button></div><p id="previous" hidden></p><p class="hint">점수 선택과 메모는 자동 저장됩니다. 다시 열어도 그대로 남습니다.</p></section>
<nav class="review-dock" aria-label="글과 장 이동"><div class="post-navigation"><button id="prevPost" type="button" aria-label="이전 글">↑ 이전 글</button><span id="postPosition" role="status" aria-live="polite"></span><button id="nextPost" type="button" aria-label="다음 글">다음 글 ↓</button></div><div id="dockPages" class="dock-pages"><button id="dockPrev" type="button" aria-label="이전 장">‹</button><span id="dockPage" aria-live="polite"></span><button id="dockNext" type="button" aria-label="다음 장">›</button></div><button id="jumpFeedback" type="button">★ 평가·메모</button></nav></section>
<section class="triage-tools" id="triage" hidden><p id="progressLabel" role="status"></p><select id="reason" aria-label="보류·탈락 이유"><option value="material_unsuitable">소재 부적합</option><option value="source_insufficient">원본 부족</option><option value="production_error">제작 오류</option></select><input id="triageNote" maxlength="10000" placeholder="보류·탈락 메모" aria-label="보류·탈락 메모"><button id="holdPost" type="button">보류</button><button id="rejectPost" type="button">탈락</button><button id="restorePost" type="button">검토 목록 복원</button><p id="sourceReason"></p></section>
</main><dialog id="titleDialog" aria-labelledby="titleDialogHeading"><h3 id="titleDialogHeading">원문 제목 전체</h3><p id="fullTitle"></p><button id="closeTitleDialog" type="button">닫기</button></dialog><script src="./source-cut-post-review.js"></script></body></html>
