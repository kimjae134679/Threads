<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Threads 게시글 평가</title><link rel="stylesheet" href="./source-cut-post-review.css"></head>
<body><aside class="library"><header><span class="eyebrow">THREADS · REVIEW</span><h1>게시글 평가</h1><p id="count">제작 결과를 불러오는 중</p></header>
<input id="search" type="search" placeholder="제목 검색" aria-label="제목 검색">
<select id="filter" aria-label="평가 상태"><option value="all">전체 글</option><option value="unrated">아직 점수 없는 글</option><option value="rated">점수 남긴 글</option><option value="low">1~5점 · 개선할 글</option></select>
<div id="posts" class="posts" aria-label="글 선택"></div><button id="openFolder" type="button">평가 기록 폴더 열기</button></aside>
<main><header class="post-head"><p class="eyebrow" id="postMeta">글을 선택하세요</p><h2 id="title">표지부터 마지막 장까지 직접 확인하세요</h2><p id="original"></p></header>
<p id="error" role="alert" hidden></p>
<section id="reader" hidden><div class="reader-tools"><div class="segments"><button id="single" type="button" aria-pressed="true">한 장씩 넘기기</button><button id="vertical" type="button" aria-pressed="false">아래로 읽기</button></div><label><input id="zoom" type="checkbox">크게 보기</label></div>
<div id="stage" class="stage"><button id="prev" class="arrow" aria-label="이전 장" type="button">‹</button><figure><img id="pageImage" alt=""><figcaption id="pageLabel"></figcaption></figure><button id="next" class="arrow" aria-label="다음 장" type="button">›</button></div>
<div id="pages" class="page-nav"><label>페이지 <select id="pageSelect" aria-label="페이지 선택"></select></label><span>← → 키 · 이미지 좌우로 밀기</span></div>
<div id="verticalPages" hidden></div>
<section class="feedback" aria-label="이 글 전체 평가"><div class="feedback-heading"><h3>이 글 전체는 몇 점인가요?</h3><strong id="scoreText">아직 평가하지 않았어요</strong></div>
<div id="scores" class="scores" role="group" aria-label="1점부터 10점까지 선택"></div>
<label for="note">평가 메모</label><textarea id="note" maxlength="10000" rows="4" placeholder="제목, 글씨, 디자인, 내용, 장 사이 흐름… 좋았던 점과 고칠 점을 적어주세요."></textarea>
<div class="save-row"><span id="saveStatus" role="status" aria-live="polite"></span><button id="save" type="button">평가 저장</button></div><p id="previous" hidden></p><p class="hint">점수 선택과 메모는 자동 저장됩니다. 다시 열어도 그대로 남습니다.</p></section></section>
</main><script src="./source-cut-post-review.js"></script></body></html>
