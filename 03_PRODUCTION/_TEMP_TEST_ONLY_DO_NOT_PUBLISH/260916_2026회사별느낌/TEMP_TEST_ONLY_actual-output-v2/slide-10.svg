<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080"><rect width="1080" height="1080" fill="#101114"/><text x="70" y="70" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#8d929c">BLIND · SOURCE-BASED TEST</text><text x="1010" y="70" text-anchor="end" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#8d929c">10 / 12</text><text x="70" y="130" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="24" font-weight="800" fill="#b7ff3c">09 · 후반</text><text x="70" y="205" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="48" font-weight="900" fill="#f5f7fa">규모보다 “요즘 이미지”가 더 크게 보이는 곳들</text><text x="70" y="290" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">LS</text><text x="300" y="290" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">대중 인지도보다 실제 규모가 큰 대기업이라는 인상</text><line x1="70" y1="362" x2="1010" y2="362" stroke="#2c3037" stroke-width="2"/><text x="70" y="435" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">SPC</text><text x="300" y="435" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">산업재해 관련 이미지 때문에 매우 부정적으로 평가</text><line x1="70" y1="507" x2="1010" y2="507" stroke="#2c3037" stroke-width="2"/><text x="70" y="580" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">네이버</text><text x="300" y="580" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">주가와 AI·신사업 방향이 앞으로의 이미지에 중요해 보인다는 의견</text><line x1="70" y1="652" x2="1010" y2="652" stroke="#2c3037" stroke-width="2"/><text x="70" y="725" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">카카오</text><text x="300" y="725" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">과거보다 비호감 이미지가 다소 약해졌다고 느꼈다는 평</text><line x1="70" y1="797" x2="1010" y2="797" stroke="#2c3037" stroke-width="2"/><text x="70" y="870" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">쿠팡</text><text x="300" y="870" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">엄청난 규모에 비해 전통적인 대기업 느낌은 약하다는 인상</text><line x1="70" y1="942" x2="1010" y2="942" stroke="#2c3037" stroke-width="2"/><text x="70" y="1025" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="20" fill="#6f7580">TEMP TEST ONLY · DO NOT PUBLISH</text></svg>