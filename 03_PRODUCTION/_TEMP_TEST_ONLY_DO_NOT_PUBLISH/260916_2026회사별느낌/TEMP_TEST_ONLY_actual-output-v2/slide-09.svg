<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080"><rect width="1080" height="1080" fill="#101114"/><text x="70" y="70" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#8d929c">BLIND · SOURCE-BASED TEST</text><text x="1010" y="70" text-anchor="end" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#8d929c">09 / 12</text><text x="70" y="130" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="24" font-weight="800" fill="#b7ff3c">08 · 유통·플랫폼</text><text x="70" y="205" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="48" font-weight="900" fill="#f5f7fa">잘 알려진 이름도 체감 이미지는 다르다</text><text x="70" y="290" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">효성</text><text x="300" y="290" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">직원들의 내부 불만 이야기가 유독 많이 보인다는 이미지</text><line x1="70" y1="362" x2="1010" y2="362" stroke="#2c3037" stroke-width="2"/><text x="70" y="435" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">농협</text><text x="300" y="435" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">안정적이고 친근한 느낌이 강한 금융사</text><line x1="70" y1="507" x2="1010" y2="507" stroke="#2c3037" stroke-width="2"/><text x="70" y="580" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">CJ</text><text x="300" y="580" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">계열사 차이는 있지만 전체적으로 트렌디하고 무난한 대기업 이미지</text><line x1="70" y1="652" x2="1010" y2="652" stroke="#2c3037" stroke-width="2"/><text x="70" y="725" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">항공사</text><text x="300" y="725" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">원문 작성자의 매우 단정적인 성별 고정관념이 포함된 항목</text><line x1="70" y1="797" x2="1010" y2="797" stroke="#2c3037" stroke-width="2"/><text x="70" y="870" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">토스</text><text x="300" y="870" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">업무 강도가 높다는 이야기가 먼저 떠오르는 회사</text><line x1="70" y1="942" x2="1010" y2="942" stroke="#2c3037" stroke-width="2"/><text x="70" y="1025" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="20" fill="#6f7580">TEMP TEST ONLY · DO NOT PUBLISH</text></svg>