      <text x="140" y="298" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="800" fill="#f4f6f8">새회사</text>
      <text x="140" y="334" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="22" fill="#cdd2d9">자영업자 정체성이 강해 보인다는 다소 냉소적인 첫인상</text><rect x="54" y="380" width="972" height="108" rx="25" fill="#191c22" stroke="#3a4048" stroke-width="2"/>
      <circle cx="98" cy="419" r="20" fill="#c2ff5b"/>
      <text x="98" y="427" text-anchor="middle" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="20" font-weight="800" fill="#0f1115">2</text>
      <text x="140" y="420" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="800" fill="#f4f6f8">스타트업</text>
      <text x="140" y="456" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="22" fill="#cdd2d9">“스타트업”이라는 이름 자체에 자부심이 강해 보인다는 평</text><rect x="54" y="502" width="972" height="108" rx="25" fill="#191c22" stroke="#3a4048" stroke-width="2"/>
      <circle cx="98" cy="541" r="20" fill="#c2ff5b"/>
      <text x="98" y="549" text-anchor="middle" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="20" font-weight="800" fill="#0f1115">3</text>
      <text x="140" y="542" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="800" fill="#f4f6f8">의사</text>
      <text x="140" y="578" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="22" fill="#cdd2d9">여전히 주변에서 선망 반응이 나오는 대표적인 직업</text><rect x="54" y="624" width="972" height="108" rx="25" fill="#191c22" stroke="#3a4048" stroke-width="2"/>
      <circle cx="98" cy="663" r="20" fill="#c2ff5b"/>
      <text x="98" y="671" text-anchor="middle" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="20" font-weight="800" fill="#0f1115">4</text>
      <text x="140" y="664" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="800" fill="#f4f6f8">회계·세무</text>
      <text x="140" y="700" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="22" fill="#cdd2d9">전문직이지만 상대적으로 임팩트는 약하다는 인상</text><rect x="54" y="746" width="972" height="108" rx="25" fill="#191c22" stroke="#3a4048" stroke-width="2"/>
      <circle cx="98" cy="785" r="20" fill="#c2ff5b"/>
      <text x="98" y="793" text-anchor="middle" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="20" font-weight="800" fill="#0f1115">5</text>
