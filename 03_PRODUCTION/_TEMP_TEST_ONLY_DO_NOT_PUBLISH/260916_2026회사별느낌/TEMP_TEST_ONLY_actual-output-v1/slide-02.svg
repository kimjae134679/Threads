  <text x="54" y="174" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#c2ff5b">초반 · 새회사 · 전문직 · 삼성</text><text x="54" y="225" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="43" font-weight="800" fill="#f4f6f8">처음엔 직업과 삼성 이야기</text><rect x="54" y="258" width="972" height="108" rx="25" fill="#191c22" stroke="#3a4048" stroke-width="2"/>
      <circle cx="98" cy="297" r="20" fill="#c2ff5b"/>
