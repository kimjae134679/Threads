      <text x="140" y="822" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="22" fill="#cdd2d9">드라마 속 강한 변론 장면이 연상되는 직업 이미지</text><rect x="54" y="868" width="972" height="108" rx="25" fill="#191c22" stroke="#3a4048" stroke-width="2"/>
      <circle cx="98" cy="907" r="20" fill="#c2ff5b"/>
      <text x="98" y="915" text-anchor="middle" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="20" font-weight="800" fill="#0f1115">6</text>
      <text x="140" y="908" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="800" fill="#f4f6f8">삼성전자</text>
      <text x="140" y="944" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="22" fill="#cdd2d9">예전의 깔끔한 이미지보다 최근 온라인 평판 변화가 크게 느껴졌다는 의견</text><line x1="54" y1="996" x2="1026" y2="996" stroke="#3a4048" stroke-width="2"/>
  <text x="54" y="1034" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="20" fill="#a4aab4">Blind 원문 작성자의 주관적 인상을 요약한 비게시용 테스트 콘텐츠</text>
