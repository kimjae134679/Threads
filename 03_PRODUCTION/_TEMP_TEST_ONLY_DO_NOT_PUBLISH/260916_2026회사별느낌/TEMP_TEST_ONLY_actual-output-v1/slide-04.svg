      <text x="140" y="420" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="800" fill="#f4f6f8">엔씨소프트</text>
      <text x="140" y="456" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="22" fill="#cdd2d9">최근 게임 성과에 대한 걱정이 먼저 떠오른다는 시선</text><rect x="54" y="502" width="972" height="108" rx="25" fill="#191c22" stroke="#3a4048" stroke-width="2"/>
