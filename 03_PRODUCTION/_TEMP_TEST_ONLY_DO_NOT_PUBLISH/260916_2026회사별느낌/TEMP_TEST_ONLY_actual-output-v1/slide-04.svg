      <text x="140" y="298" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="800" fill="#f4f6f8">현대제철</text>
      <text x="140" y="334" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="22" fill="#cdd2d9">보수적이고 회식이 잦을 것 같은 조직문화 이미지</text><rect x="54" y="380" width="972" height="108" rx="25" fill="#191c22" stroke="#3a4048" stroke-width="2"/>
