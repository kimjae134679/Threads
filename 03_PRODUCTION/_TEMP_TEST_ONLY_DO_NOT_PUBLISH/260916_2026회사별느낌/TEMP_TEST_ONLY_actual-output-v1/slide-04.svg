  <text x="54" y="174" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#c2ff5b">게임 · 식품 · 공기업</text><text x="54" y="225" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="43" font-weight="800" fill="#f4f6f8">게임사는 기대와 걱정이 갈렸다</text><rect x="54" y="258" width="972" height="108" rx="25" fill="#191c22" stroke="#3a4048" stroke-width="2"/>
      <circle cx="98" cy="297" r="20" fill="#c2ff5b"/>
