      <text x="140" y="944" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="22" fill="#cdd2d9">한수원은 깔끔한 공기업, 코레일은 보상 아쉬움이 먼저 떠오른다는 인상</text><line x1="54" y1="996" x2="1026" y2="996" stroke="#3a4048" stroke-width="2"/>
  <text x="54" y="1034" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="20" fill="#a4aab4">Blind 원문 작성자의 주관적 인상을 요약한 비게시용 테스트 콘텐츠</text>
