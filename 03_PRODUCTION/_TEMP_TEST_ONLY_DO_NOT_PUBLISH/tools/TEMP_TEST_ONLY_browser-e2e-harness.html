<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEMP TEST ONLY Browser E2E Harness</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:32px auto;padding:0 20px;background:#111;color:#eee}.danger{color:#ff8b8b;font-weight:800}.pass{color:#8fda9b}.fail{color:#ff8b8b}pre{white-space:pre-wrap;border:1px solid #555;padding:16px}</style></head><body>
<h1>TEMP TEST ONLY · DO NOT PUBLISH</h1><p class="danger">합성 fixture만 사용합니다. 실제 게시/실사용 검증이 아닙니다.</p><pre id="out">RUNNING…</pre>
<script type="module">
import {buildBrowserConversionModel,restoreBrowserConversionModel} from './browser-conversion-adapter.js';
const out=document.querySelector('#out'); const results=[];
const check=(name,ok)=>{results.push({name,ok}); if(!ok) throw new Error(name)};
const canonical=m=>JSON.stringify({temporaryTestOnly:m.temporaryTestOnly,publicationAllowed:m.publicationAllowed,title:m.title,sourceType:m.sourceType,cover:m.cover,slides:m.slides,sourceMediaOrderPolicy:m.sourceMediaOrderPolicy});
const digest=async m=>{const bytes=new TextEncoder().encode(canonical(m));const hash=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')};
try{
 const source='첫 문단은 합성 브라우저 테스트입니다. 실제 제3자 원문이 아닙니다.\n\n두 번째 문단은 다운로드와 fresh-page 복원을 흉내 내기 위한 합성 문장입니다.';
 const model=buildBrowserConversionModel({sourceText:source,title:'TEMP 브라우저 E2E',sourceType:'text'});
 check('safety flags',model.temporaryTestOnly===true&&model.publicationAllowed===false);
 check('cover rule',model.cover.mode==='text-only'&&model.cover.generatedImage===false&&model.cover.blur===false&&model.cover.titlePosition==='upper'&&model.cover.outline==='thin');
 check('slide numbering',model.slides.length>=1&&model.slides[0].index===2);
 const approved=structuredClone(model); approved.tempApproval={approved:true,scope:'TEMP_TEST_ONLY_DO_NOT_PUBLISH',runtimeReflected:true,sha256:await digest(model)};
 const blob=new Blob([JSON.stringify(approved)],{type:'application/json'}); const downloaded=await blob.text();
 const freshPageRestored=restoreBrowserConversionModel(downloaded);
 check('fresh-page restore flags',freshPageRestored.temporaryTestOnly===true&&freshPageRestored.publicationAllowed===false);
 check('approval digest matches',freshPageRestored.tempApproval.sha256===await digest(freshPageRestored));
 const tampered=structuredClone(freshPageRestored); tampered.title='변조된 제목';
 check('tamper detected',tampered.tempApproval.sha256!==await digest(tampered));
 let refused=false; try{restoreBrowserConversionModel(JSON.stringify({...approved,publicationAllowed:true}))}catch{refused=true} check('publishable restore refused',refused);
 out.textContent=results.map(r=>'PASS  '+r.name).join('\n')+'\n\nTEMP_TEST_ONLY=true\npublicationAllowed=false\nNo network/publish action performed.'; out.className='pass'; document.documentElement.dataset.tempE2e='pass';
}catch(err){out.textContent=results.map(r=>(r.ok?'PASS  ':'FAIL  ')+r.name).join('\n')+'\n\nERROR: '+err.message;out.className='fail';document.documentElement.dataset.tempE2e='fail';}
</script></body></html>
