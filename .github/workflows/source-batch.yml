name: source-batch
on:
  pull_request:
    paths:
      - '99_작업영역/소스/app/source-batch*'
      - '99_작업영역/소스/app/source-cut-zip.js'
      - '99_작업영역/소스/scripts/inventory-existing-materials.mjs'
      - '99_작업영역/소스/scripts/build-source-work-queue.mjs'
      - '99_작업영역/소스/scripts/acquire-existing-sources.mjs'
      - '99_작업영역/소스/test/acquire-existing-sources.test.mjs'
      - '99_작업영역/소스/test/source-batch-core.test.mjs'
      - '.github/workflows/source-batch.yml'
  workflow_dispatch:
defaults:
  run:
    working-directory: 99_작업영역/소스

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check app/source-batch-core.js
      - run: node --check app/source-batch.js
      - run: node --check app/source-cut-zip.js
      - run: node --check scripts/inventory-existing-materials.mjs
      - run: node --check scripts/build-source-work-queue.mjs
      - run: node --check scripts/acquire-existing-sources.mjs
      - run: node --test test/source-batch-core.test.mjs test/acquire-existing-sources.test.mjs
      - run: node scripts/inventory-existing-materials.mjs
      - run: node scripts/build-source-work-queue.mjs
