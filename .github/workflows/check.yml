name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: JavaScript syntax and regression checks
        run: npm run check
      - name: Local server smoke test
        shell: bash
        run: |
          set -euo pipefail
          node server.mjs >/tmp/threads-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/threads-server.log || true' EXIT

          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/api/health >/tmp/health.json; then
              break
            fi
            sleep 0.25
          done

          node --input-type=module - <<'NODE'
          const health = await fetch('http://127.0.0.1:4173/api/health').then(r => r.json());
          if (!health.ok || health.service !== 'threads-trend-inbox') throw new Error('health check failed');

          const connectors = await fetch('http://127.0.0.1:4173/api/connectors').then(r => r.json());
          if (!connectors.ok) throw new Error('connectors check failed');
          if (connectors.connectors?.openai?.configured !== false) throw new Error('OpenAI must be unconfigured in CI without secret');
          if (connectors.connectors?.youtubeMostPopularKr?.configured !== false) throw new Error('YouTube must be unconfigured in CI without secret');
          if (connectors.connectors?.threads?.configured !== false) throw new Error('Threads must be unconfigured in CI without secret');
          if (connectors.connectors?.naverApiHub?.configured !== false) throw new Error('NAVER API HUB must be unconfigured in CI without secret');

          const app = await fetch('http://127.0.0.1:4173/app/');
          const html = await app.text();
          const htmlScripts = ['ai-studio.js', 'source-enrichment.js', 'account-registry.js', 'experiment-assignment.js', 'threads-publisher.js', 'experiment-model.js', 'experiment-lab.js'];
          if (!app.ok || !html.includes('Trend Inbox') || htmlScripts.some((name) => !html.includes(name))) {
            throw new Error('static app feature loading check failed');
          }

          const baseAssets = [
            ...htmlScripts,
            'content-strategy.js',
            'publication-strategy-snapshot.js',
            'experiment-metadata.js',
            'viral-model.js',
            'viral-review.js',
            'card-story-model.js',
            'card-factory.js',
            'warehouse-model.js',
            'content-warehouse.js',
            'bootstrap/feature-loader.js',
            'features/themes/theme-taxonomy.js',
            'features/themes/theme-model.js',
            'features/themes/theme-review.js',
            'features/themes/theme-review.css',
          ];
          for (const asset of baseAssets) {
            const response = await fetch(`http://127.0.0.1:4173/app/${asset}`);
            if (!response.ok) throw new Error(`missing static asset ${asset}`);
          }

          const assignmentBootstrap = await fetch('http://127.0.0.1:4173/app/experiment-assignment.js').then(r => r.text());
          if (!assignmentBootstrap.includes('bootstrap/feature-loader.js') || assignmentBootstrap.includes('loadCompanion')) {
            throw new Error('experiment assignment must delegate feature loading to central bootstrap');
          }

          const featureBootstrap = await fetch('http://127.0.0.1:4173/app/bootstrap/feature-loader.js').then(r => r.text());
          for (const required of [
            'features/themes/theme-taxonomy.js',
            'features/themes/theme-model.js',
            'features/themes/theme-review.js',
            'viral-model.js',
            'card-story-model.js',
            'warehouse-model.js',
            'content-warehouse.js',
          ]) {
            if (!featureBootstrap.includes(required)) throw new Error(`feature bootstrap missing ${required}`);
          }

          const contentStrategy = await fetch('http://127.0.0.1:4173/app/content-strategy.js').then(r => r.text());
          if (!contentStrategy.includes('publication-strategy-snapshot.js') || !contentStrategy.includes('A10')) {
            throw new Error('content strategy publication snapshot or rights guard missing');
          }

          for (const stylesheet of ['experiment-assignment.css', 'content-strategy.css', 'experiment-metadata.css', 'viral-review.css', 'card-factory.css', 'content-warehouse.css']) {
            const response = await fetch(`http://127.0.0.1:4173/app/${stylesheet}`);
            if (!response.ok) throw new Error(`missing stylesheet ${stylesheet}`);
          }

          const research = await fetch('http://127.0.0.1:4173/api/ai/research', {
            method: 'POST', headers: {'content-type': 'application/json'},
            body: JSON.stringify({candidate: {title: 'CI smoke test'}}),
          });
          const researchBody = await research.json();
          if (research.status !== 503 || researchBody.error !== 'openai_api_key_missing') {
            throw new Error(`expected OpenAI missing-key 503, got ${research.status} ${JSON.stringify(researchBody)}`);
          }

          const naver = await fetch('http://127.0.0.1:4173/api/naver/search?type=news&query=AI');
          const naverBody = await naver.json();
          if (naver.status !== 503 || naverBody.error !== 'naver_api_hub_credentials_missing') {
            throw new Error(`expected NAVER missing-key 503, got ${naver.status} ${JSON.stringify(naverBody)}`);
          }

          const threadsProfile = await fetch('http://127.0.0.1:4173/api/threads/profile');
          const threadsProfileBody = await threadsProfile.json();
          if (threadsProfile.status !== 503 || threadsProfileBody.error !== 'threads_access_token_missing') {
            throw new Error(`expected Threads missing-token 503, got ${threadsProfile.status} ${JSON.stringify(threadsProfileBody)}`);
          }

          const unapproved = await fetch('http://127.0.0.1:4173/api/threads/publish', {
            method: 'POST', headers: {'content-type':'application/json'},
            body: JSON.stringify({candidate: {title: 'CI publish guard'}}),
          });
          const unapprovedBody = await unapproved.json();
          if (unapproved.status !== 409 || unapprovedBody.error !== 'candidate_not_ready') {
            throw new Error(`expected publish guard 409, got ${unapproved.status} ${JSON.stringify(unapprovedBody)}`);
          }
          NODE
