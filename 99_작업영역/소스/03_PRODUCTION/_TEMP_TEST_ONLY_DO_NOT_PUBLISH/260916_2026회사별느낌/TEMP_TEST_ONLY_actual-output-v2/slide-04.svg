<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080"><rect width="1080" height="1080" fill="#101114"/><text x="70" y="70" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#8d929c">BLIND · SOURCE-BASED TEST</text><text x="1010" y="70" text-anchor="end" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#8d929c">04 / 12</text><text x="70" y="130" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="24" font-weight="800" fill="#b7ff3c">03 · 자동차·SK</text><text x="70" y="205" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="48" font-weight="900" fill="#f5f7fa">현대와 SK는 비교적 선명한 이미지</text><text x="70" y="290" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">롯데</text><text x="300" y="290" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">직원들의 회사 불만이 자주 보인다는 이미지</text><line x1="70" y1="362" x2="1010" y2="362" stroke="#2c3037" stroke-width="2"/><text x="70" y="435" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">현대자동차</text><text x="300" y="435" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">건실하고 안정적인 대표 대기업 이미지</text><line x1="70" y1="507" x2="1010" y2="507" stroke="#2c3037" stroke-width="2"/><text x="70" y="580" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">기아</text><text x="300" y="580" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">현대차와 붙여서 보는 인상이 강하다는 짧은 평</text><line x1="70" y1="652" x2="1010" y2="652" stroke="#2c3037" stroke-width="2"/><text x="70" y="725" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">SK</text><text x="300" y="725" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">말투나 분위기가 지적인 느낌이라는 인상</text><line x1="70" y1="797" x2="1010" y2="797" stroke="#2c3037" stroke-width="2"/><text x="70" y="870" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">SK하이닉스</text><text x="300" y="870" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">선망도가 높고 좋은 직장 이미지가 강하다는 평</text><line x1="70" y1="942" x2="1010" y2="942" stroke="#2c3037" stroke-width="2"/><text x="70" y="1025" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="20" fill="#6f7580">TEMP TEST ONLY · DO NOT PUBLISH</text></svg>