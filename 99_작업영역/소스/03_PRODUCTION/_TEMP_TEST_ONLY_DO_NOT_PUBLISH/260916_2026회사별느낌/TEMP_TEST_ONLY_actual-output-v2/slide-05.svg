<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080"><rect width="1080" height="1080" fill="#101114"/><text x="70" y="70" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#8d929c">BLIND · SOURCE-BASED TEST</text><text x="1010" y="70" text-anchor="end" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#8d929c">05 / 12</text><text x="70" y="130" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="24" font-weight="800" fill="#b7ff3c">04 · 에너지·게임</text><text x="70" y="205" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="48" font-weight="900" fill="#f5f7fa">게임사는 기대와 걱정이 갈렸다</text><text x="70" y="290" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">SKT</text><text x="300" y="290" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">깔끔하고 배운 느낌이 나는 통신사 이미지</text><line x1="70" y1="362" x2="1010" y2="362" stroke="#2c3037" stroke-width="2"/><text x="70" y="435" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">S-OIL·현오뱅</text><text x="300" y="435" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">돈 잘 버는 정유사 이미지가 먼저 떠오른다는 평</text><line x1="70" y1="507" x2="1010" y2="507" stroke="#2c3037" stroke-width="2"/><text x="70" y="580" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">한화·코오롱</text><text x="300" y="580" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">개인 면접 경험과 무난한 대기업 이미지가 섞인 평가</text><line x1="70" y1="652" x2="1010" y2="652" stroke="#2c3037" stroke-width="2"/><text x="70" y="725" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">현대제철</text><text x="300" y="725" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">보수적이고 회식이 잦을 것 같은 조직문화 이미지</text><line x1="70" y1="797" x2="1010" y2="797" stroke="#2c3037" stroke-width="2"/><text x="70" y="870" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">엔씨소프트</text><text x="300" y="870" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">최근 게임 성과에 대한 걱정이 먼저 떠오른다는 시선</text><line x1="70" y1="942" x2="1010" y2="942" stroke="#2c3037" stroke-width="2"/><text x="70" y="1025" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="20" fill="#6f7580">TEMP TEST ONLY · DO NOT PUBLISH</text></svg>