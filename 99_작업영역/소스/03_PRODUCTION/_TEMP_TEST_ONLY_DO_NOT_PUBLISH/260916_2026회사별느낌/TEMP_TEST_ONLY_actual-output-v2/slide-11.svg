<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080"><rect width="1080" height="1080" fill="#101114"/><text x="70" y="70" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#8d929c">BLIND · SOURCE-BASED TEST</text><text x="1010" y="70" text-anchor="end" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#8d929c">11 / 12</text><text x="70" y="130" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="24" font-weight="800" fill="#b7ff3c">10 · 마지막</text><text x="70" y="205" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="48" font-weight="900" fill="#f5f7fa">마지막까지 이어지는 회사별 한줄평</text><text x="70" y="290" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">KT</text><text x="300" y="290" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">인지도는 높지만 뚜렷한 캐릭터는 약하고 평범하다는 평가</text><line x1="70" y1="362" x2="1010" y2="362" stroke="#2c3037" stroke-width="2"/><text x="70" y="435" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">현대오토에버</text><text x="300" y="435" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">현대 계열사인데도 젊고 IT 회사 같은 느낌</text><line x1="70" y1="507" x2="1010" y2="507" stroke="#2c3037" stroke-width="2"/><text x="70" y="580" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">두산</text><text x="300" y="580" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">듬직하고 강한 남성적 이미지가 먼저 떠오른다는 평</text><line x1="70" y1="652" x2="1010" y2="652" stroke="#2c3037" stroke-width="2"/><text x="70" y="725" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">안랩</text><text x="300" y="725" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">지적이면서 깐깐한 이미지</text><line x1="70" y1="797" x2="1010" y2="797" stroke="#2c3037" stroke-width="2"/><text x="70" y="870" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="30" font-weight="900" fill="#b7ff3c">기업은행</text><text x="300" y="870" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="28" font-weight="600" fill="#f1f3f6">은행권 중 젊고 세련된 이미지가 강하다는 평가</text><line x1="70" y1="942" x2="1010" y2="942" stroke="#2c3037" stroke-width="2"/><text x="70" y="1025" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="20" fill="#6f7580">TEMP TEST ONLY · DO NOT PUBLISH</text></svg>