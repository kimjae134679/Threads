    <text x="88" y="608" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="27" font-weight="800" fill="#c2ff5b">이 카드 세트에서 한 것</text><text x="88" y="666" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="27" fill="#d6dae1">• 공개 원문에서 확인된 순서를 따라 핵심 인상만 압축</text><text x="88" y="716" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="27" fill="#d6dae1">• 원문에 없는 수치·사건·동기 추가하지 않음</text><text x="88" y="766" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="27" fill="#d6dae1">• 텍스트 원문이므로 생성 이미지·블러 사용하지 않음</text><text x="88" y="816" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="27" fill="#d6dae1">• 실제 게시 전 권리·명예훼손·개인정보 검수는 별도 필요</text><line x1="54" y1="996" x2="1026" y2="996" stroke="#3a4048" stroke-width="2"/>
  <text x="54" y="1034" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="20" fill="#a4aab4">Blind 원문 작성자의 주관적 인상을 요약한 비게시용 테스트 콘텐츠</text>
