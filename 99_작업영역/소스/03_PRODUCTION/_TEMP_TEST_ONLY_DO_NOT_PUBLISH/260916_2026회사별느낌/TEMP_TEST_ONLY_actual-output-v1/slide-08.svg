  <text x="54" y="174" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="24" font-weight="700" fill="#c2ff5b">END / SOURCE NOTE</text><text x="54" y="320" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="70" font-weight="800" fill="#f4f6f8" stroke="#000" stroke-width="2" paint-order="stroke">“원하면 추가하겠음”</text>
    <text x="54" y="395" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="34" fill="#d6dae1">원문은 마지막까지 회사·직업 이미지를</text>
    <text x="54" y="445" font-family="Pretendard,Noto Sans KR,sans-serif" font-size="34" fill="#d6dae1">짧게 이어 붙이는 형식으로 끝납니다.</text>
