<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEMP TEST ONLY Review</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:32px auto;padding:0 20px;background:#111;color:#eee}header{border:2px solid #e66;padding:16px;margin-bottom:20px}textarea{width:100%;min-height:180px}button{margin:8px 8px 8px 0;padding:10px 14px}.card{border:1px solid #555;padding:14px;margin:10px 0}.danger{color:#ff8b8b;font-weight:800}.approved{border-color:#7aa;padding:14px;margin-top:18px}</style></head><body>
<header><div class="danger">TEMP TEST ONLY · DO NOT PUBLISH</div><div>이 화면은 합성 fixture/임시 변환 모델 검수 전용입니다. 실제 게시 승인 화면이 아닙니다.</div></header>
<textarea id="source">첫 문단은 합성 테스트 문장입니다. 실제 제3자 원문이 아닙니다.\n\n두 번째 문단도 복원 테스트를 위한 가짜 문장입니다.</textarea><br>
<button id="build">TEMP 모델 생성</button><button id="approve" disabled>TEMP 승인본으로 고정</button><button id="download" disabled>JSON 다운로드</button><input id="restore" type="file" accept="application/json">
<div id="status"></div><div id="slides"></div><div id="approved"></div>
<script type="module">
import {buildBrowserConversionModel,restoreBrowserConversionModel} from './browser-conversion-adapter.js';
let model=null, approvedModel=null; const status=document.querySelector('#status'), slides=document.querySelector('#slides'), approved=document.querySelector('#approved');
const assertSafe=m=>{if(!m?.temporaryTestOnly||m?.publicationAllowed!==false)throw new Error('publishable model refused')};
const canonical=m=>JSON.stringify({temporaryTestOnly:m.temporaryTestOnly,publicationAllowed:m.publicationAllowed,title:m.title,sourceType:m.sourceType,cover:m.cover,slides:m.slides,sourceMediaOrderPolicy:m.sourceMediaOrderPolicy});
const digest=async m=>{const bytes=new TextEncoder().encode(canonical(m));const hash=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')};
function render(m){assertSafe(m);status.textContent=`TEMP=${m.temporaryTestOnly} · publicationAllowed=${m.publicationAllowed} · cover=${m.cover.mode}`;slides.innerHTML=m.slides.map(s=>`<div class="card"><b>Slide ${s.index}</b><div>${s.text.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div></div>`).join('')}
async function reflectApproved(m,{restored=false}={}){assertSafe(m);const expected=restored?m.tempApproval?.sha256:null;if(restored&&!expected)throw new Error('TEMP approval digest missing');const actual=await digest(m);if(restored&&expected!==actual)throw new Error('TEMP approval snapshot changed after approval');approvedModel=structuredClone(m);approvedModel.tempApproval={approved:true,scope:'TEMP_TEST_ONLY_DO_NOT_PUBLISH',runtimeReflected:true,sha256:actual};approved.innerHTML=`<div class="card approved"><b>TEMP 승인 반영 확인</b><div>실행 환경은 현재 승인 스냅샷의 ${approvedModel.slides.length}개 슬라이드를 사용합니다.</div><div>SHA-256 ${actual.slice(0,16)}…</div><div class="danger">publicationAllowed=false · 실제 게시 승인 아님</div></div>`;document.querySelector('#download').disabled=false}
document.querySelector('#build').onclick=()=>{model=buildBrowserConversionModel({sourceText:document.querySelector('#source').value,title:'TEMP 합성 검수',sourceType:'text'});render(model);approved.innerHTML='';approvedModel=null;document.querySelector('#approve').disabled=false;document.querySelector('#download').disabled=true};
document.querySelector('#approve').onclick=()=>reflectApproved(model);
document.querySelector('#download').onclick=()=>{if(!approvedModel)throw new Error('TEMP approval snapshot required');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(approvedModel,null,2)],{type:'application/json'}));a.download='TEMP_TEST_ONLY_DO_NOT_PUBLISH_APPROVED_conversion.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.querySelector('#restore').onchange=async e=>{try{model=restoreBrowserConversionModel(await e.target.files[0].text());render(model);if(model.tempApproval?.scope==='TEMP_TEST_ONLY_DO_NOT_PUBLISH')await reflectApproved(model,{restored:true});else{approved.innerHTML='';approvedModel=null;document.querySelector('#download').disabled=true}document.querySelector('#approve').disabled=false}catch(err){status.textContent='복원 거부: '+err.message;slides.innerHTML='';approved.innerHTML='';approvedModel=null;document.querySelector('#download').disabled=true}};
</script></body></html>
