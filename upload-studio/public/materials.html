<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전체 자료 · 검토와 수동 업로드</title><link rel="stylesheet" href="/materials.css"></head><body>
<header><a href="/">← 검토 화면</a><h1>전체 자료 · 검토와 수동 업로드</h1><button id="refresh">최신 저장본 확인</button><button id="audit">전체 파일 검증</button></header>
<p id="status" role="status" aria-live="polite">운영 카탈로그를 읽는 중…</p><p id="summary"></p><p class="notice">저장된 자료를 읽습니다. 현재 사용자 통과, 미확정 자료, 과거 기록을 구분합니다. 자료 다운로드는 게시 승인이나 게시 완료를 뜻하지 않습니다.</p>
<main><aside><label>범위<select id="scope"><option value="live">전체 현재·제작 자료 · 버전 구분</option><option value="current">현재 검토 제작물</option><option value="producer">제작 폴더 별도 버전</option><option value="intake">원본 검토·제작 대기</option><option value="collection">수집 원문 · 미제작·미승인</option><option value="historical">과거 버전·편집 기록</option><option value="all">모든 저장 기록</option></select></label><label>검토 상태<select id="decision"><option value="all">전체 상태</option><option value="unreviewed">미검토</option><option value="reviewing">검토 중 · 미확정</option><option value="passed">사용자 통과</option><option value="revise">수정</option><option value="hold">보류</option><option value="discard">폐기</option></select></label><input id="search" type="search" placeholder="제목·글 ID 검색" aria-label="자료 검색"><p id="list-count"></p><div id="list"></div><div class="pager"><button id="previous">이전</button><span id="page"></span><button id="next">다음</button></div></aside>
<section id="detail" aria-live="polite"><p>자료를 선택하면 본문·이미지·해시태그와 기존 평가를 함께 볼 수 있습니다.</p></section></main><script type="module" src="/materials.js"></script></body></html>
